services:
  datagram-agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: datagram-agent
    # Mount Docker socket read-only for security
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      # Control plane URL (change to your webapp URL)
      - CONTROL_PLANE_URL=${CONTROL_PLANE_URL:-http://localhost:5000}
      # Agent API key for authentication (change this!)
      - AGENT_API_KEY=${AGENT_API_KEY:-change-this-api-key}
      # Unique host identifier
      - HOST_ID=${HOST_ID:-agent-host-1}
    # Memory limit: 50MB
    mem_limit: 50m
    restart: unless-stopped
    networks:
      - datagram-network

networks:
  datagram-network:
    driver: bridge
