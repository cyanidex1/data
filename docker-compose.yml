services:
  datagram-control-panel:
    build:
      context: .
      dockerfile: webapp/Dockerfile
    container_name: datagram-control-panel
    ports:
      - "5000:5000"
    volumes:
      # Mount Docker socket to manage containers on the same host
      - /var/run/docker.sock:/var/run/docker.sock
      # Persistent storage for host configuration
      - ./data:/data
    environment:
      - SECRET_KEY=${SECRET_KEY:-change-this-to-a-random-secret-key}
      - DEBUG=${DEBUG:-False}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
      # Container ulimit for file descriptors (default: 8192)
      # Set to support running 500+ containers on a single host
      # Increase if containers need more file descriptors
      - CONTAINER_ULIMIT=${CONTAINER_ULIMIT:-8192}
    restart: unless-stopped
    # Run as root to access Docker socket
    user: root
    networks:
      - datagram-network

networks:
  datagram-network:
    driver: bridge
